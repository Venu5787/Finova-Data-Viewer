<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finova Data Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Heading -->
        <h1>Finova Data Viewer</h1>

        <!-- Search Section -->
        <div class="search-section">
            <input 
                type="text" 
                placeholder="Enter Stock Symbol or Cryptocurrency Name"
            >
            <button>Search</button>
        </div>

        <!-- Data Display Section -->
        <div class="data-section">
            <!-- Stock Container -->
            <div class="box">
                <h2>Stock Information</h2>
                <p class="placeholder">
                    Stock data will be displayed here.
                </p>
            </div>

            <!-- Crypto Container -->
            <div class="box">
                <h2>Cryptocurrency Information</h2>
                <p class="placeholder">
                    Cryptocurrency data will be displayed here.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
